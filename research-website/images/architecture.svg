    <text x="24" y="26" fill="#7e22ce" font-family="'Roboto', sans-serif" font-size="14" font-weight="800">3. AI &amp; DEEP LEARNING MICROSERVICES (Python 3.10+ + FastAPI + PyTorch + TorchVision)</text>
    
    <g transform="translate(20, 38)">
      <!-- AI 1 -->
      <rect width="215" height="100" rx="8" fill="#ffffff" stroke="#e9d5ff" />
      <text x="107" y="20" fill="#581c87" font-size="11" font-weight="700" text-anchor="middle">Pillar 1: Math Neural Net</text>
      <text x="107" y="38" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">MultimodalFusionNet</text>
      <text x="107" y="54" fill="#64748b" font-size="9" text-anchor="middle">• 5D Affect &amp; Speed Input Vector</text>
      <text x="107" y="70" fill="#64748b" font-size="9" text-anchor="middle">• Non-Repetitive 5-Tier Paper Gen</text>
      <text x="107" y="86" fill="#64748b" font-size="9" text-anchor="middle">• Misconception Classification</text>

      <!-- AI 2 -->
      <rect x="230" width="220" height="100" rx="8" fill="#ffffff" stroke="#e9d5ff" />
      <text x="340" y="20" fill="#581c87" font-size="11" font-weight="700" text-anchor="middle">Pillar 2: Speech &amp; Lip Net</text>
      <text x="340" y="38" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">Faster-Whisper + YIN DSP</text>
      <text x="340" y="54" fill="#64748b" font-size="9" text-anchor="middle">• 12 Sri Lankan MTI Rule Detectors</text>
      <text x="340" y="70" fill="#64748b" font-size="9" text-anchor="middle">• OpenCV Haar + YCrCb Lip Kinematics</text>
      <text x="340" y="86" fill="#64748b" font-size="9" text-anchor="middle">• Needleman-Wunsch DP Alignment</text>

      <!-- AI 3 -->
      <rect x="465" width="220" height="100" rx="8" fill="#ffffff" stroke="#e9d5ff" />
      <text x="575" y="20" fill="#581c87" font-size="11" font-weight="700" text-anchor="middle">Pillar 3: Vision &amp; Creative</text>
      <text x="575" y="38" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">CLIP ViT-B/32 + Gemini 2.5</text>
      <text x="575" y="54" fill="#64748b" font-size="9" text-anchor="middle">• Strict Euclidean Pixel Line Tracing</text>
      <text x="575" y="70" fill="#64748b" font-size="9" text-anchor="middle">• Convex Hull Origami Fold Tracker</text>
      <text x="575" y="86" fill="#64748b" font-size="9" text-anchor="middle">• Zero-Shot Story Comprehension</text>

      <!-- AI 4 -->
      <rect x="700" width="205" height="100" rx="8" fill="#ffffff" stroke="#e9d5ff" />
      <text x="802" y="20" fill="#581c87" font-size="11" font-weight="700" text-anchor="middle">Pillar 4: Sinhala Grapheme</text>
      <text x="802" y="38" fill="#2563eb" font-size="10" font-weight="600" text-anchor="middle">SinhalaCNN + DKT LSTM</text>
      <text x="802" y="54" fill="#64748b" font-size="9" text-anchor="middle">• 3-Block 2D Grapheme CNN</text>
      <text x="802" y="70" fill="#64748b" font-size="9" text-anchor="middle">• Bidirectional Chamfer Distance</text>
      <text x="802" y="86" fill="#64748b" font-size="9" text-anchor="middle">• 2-Layer Cognitive Mastery DKT</text>
    </g>
  </g>

  <!-- Connectors Layer 3 -> Layer 4 -->
  <line x1="500" y1="520" x2="500" y2="550" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4" />

  <!-- Layer 4: Persistence Layer -->
  <g transform="translate(30, 550)">
    <rect width="940" height="95" rx="12" fill="url(#layer4Grad)" stroke="#fb923c" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="26" fill="#c2410c" font-family="'Roboto', sans-serif" font-size="14" font-weight="800">4. PERSISTENCE &amp; STORAGE LAYER (MongoDB Atlas Cloud Cluster)</text>
    
    <g transform="translate(20, 36)">
      <rect width="215" height="46" rx="6" fill="#ffffff" stroke="#fed7aa" />
      <text x="107" y="20" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">Users &amp; Roles</text>
      <text x="107" y="36" fill="#64748b" font-size="9" text-anchor="middle">Students, Teachers, Credentials</text>

      <rect x="230" width="220" height="46" rx="6" fill="#ffffff" stroke="#fed7aa" />
      <text x="340" y="20" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">QuestionAttempt Traces</text>
      <text x="340" y="36" fill="#64748b" font-size="9" text-anchor="middle">Millisecond Response &amp; Error Data</text>

      <rect x="465" width="220" height="46" rx="6" fill="#ffffff" stroke="#fed7aa" />
      <text x="575" y="20" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">StudentAnalytics Collection</text>
      <text x="575" y="36" fill="#64748b" font-size="9" text-anchor="middle">Cognitive Mastery Vector Trajectories</text>

      <rect x="700" width="205" height="46" rx="6" fill="#ffffff" stroke="#fed7aa" />
      <text x="802" y="20" fill="#9a3412" font-size="11" font-weight="700" text-anchor="middle">CreativeActivityRecord</text>
      <text x="802" y="36" fill="#64748b" font-size="9" text-anchor="middle">Worksheets, Videos &amp; Rubrics</text>
    </g>
  </g>
</svg>
