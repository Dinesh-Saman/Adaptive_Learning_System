<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="layer1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="layer2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>
    <linearGradient id="layer3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff" />
      <stop offset="100%" stop-color="#f5d0fe" />
    </linearGradient>
    <linearGradient id="layer4Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="680" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />

  <!-- Title Banner -->
  <rect x="0" y="0" width="1000" height="70" rx="16" fill="url(#headerGrad)" />
  <text x="500" y="42" fill="#ffffff" font-family="'Roboto', sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="1">
    NANA PIYASA — HIGH-LEVEL SYSTEM ARCHITECTURE &amp; DATA PIPELINES
  </text>

  <!-- Layer 1: Client Interaction Layer -->
  <g transform="translate(30, 90)">
    <rect width="940" height="120" rx="12" fill="url(#layer1Grad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="28" fill="#0369a1" font-family="'Roboto', sans-serif" font-size="14" font-weight="800">1. CLIENT INTERACTION LAYER (React 18 + Vite + Tailwind CSS + Web Audio/Video API)</text>
    
    <!-- Subcards -->
    <g transform="translate(20, 42)">
      <!-- Card 1 -->
      <rect width="170" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" />
      <text x="85" y="24" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">Adaptive Math Hub</text>
      <text x="85" y="44" fill="#64748b" font-size="9" text-anchor="middle">WebCam Affect Tracking</text>
      <text x="85" y="56" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">face-api.js (TinyFace)</text>

      <!-- Card 2 -->
      <rect x="180" width="170" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" />
      <text x="265" y="24" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">English Speech Hub</text>
      <text x="265" y="44" fill="#64748b" font-size="9" text-anchor="middle">Mic Audio 16kHz PCM</text>
      <text x="265" y="56" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">WebCam Mouth ROI</text>

      <!-- Card 3 -->
      <rect x="360" width="170" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" />
      <text x="445" y="24" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">Pre-School Motor Hub</text>
      <text x="445" y="44" fill="#64748b" font-size="9" text-anchor="middle">Canvas Pixel Tracing</text>
      <text x="445" y="56" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">Origami Camera Stream</text>

      <!-- Card 4 -->
      <rect x="540" width="170" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" />
      <text x="625" y="24" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">Sinhala Handwriting Hub</text>
      <text x="625" y="44" fill="#64748b" font-size="9" text-anchor="middle">HTML5 Touch/Stylus Canvas</text>
      <text x="625" y="56" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">64x64 Grapheme Normalizer</text>

      <!-- Card 5 -->
      <rect x="720" width="175" height="64" rx="8" fill="#ffffff" stroke="#bae6fd" />
      <text x="807" y="24" fill="#0c4a6e" font-size="11" font-weight="700" text-anchor="middle">Analytics Dashboard</text>
      <text x="807" y="44" fill="#64748b" font-size="9" text-anchor="middle">Teacher Progress Tracking</text>
      <text x="807" y="56" fill="#2563eb" font-size="9" font-weight="700" text-anchor="middle">Cognitive Mastery Vectors</text>
    </g>
  </g>

  <!-- Connectors Layer 1 -> Layer 2 -->
  <line x1="200" y1="210" x2="200" y2="240" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4" />
  <line x1="500" y1="210" x2="500" y2="240" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4" />
  <line x1="800" y1="210" x2="800" y2="240" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="4" />

  <!-- Layer 2: API Gateway & Application Server -->
  <g transform="translate(30, 240)">
    <rect width="940" height="95" rx="12" fill="url(#layer2Grad)" stroke="#34d399" stroke-width="1.5" filter="url(#cardShadow)" />
    <text x="24" y="26" fill="#065f46" font-family="'Roboto', sans-serif" font-size="14" font-weight="800">2. API GATEWAY &amp; APPLICATION SERVER (Node.js + Express.js + JWT Auth)</text>
    
    <g transform="translate(20, 36)">
      <rect width="170" height="46" rx="6" fill="#ffffff" stroke="#a7f3d0" />
      <text x="85" y="20" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">/api/math Route</text>
      <text x="85" y="36" fill="#64748b" font-size="9" text-anchor="middle">5-Stage Paper Engine</text>

      <rect x="180" width="170" height="46" rx="6" fill="#ffffff" stroke="#a7f3d0" />
      <text x="265" y="20" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">/api/english Route</text>
      <text x="265" y="36" fill="#64748b" font-size="9" text-anchor="middle">Audio &amp; Lip Multipart</text>

      <rect x="360" width="170" height="46" rx="6" fill="#ffffff" stroke="#a7f3d0" />
      <text x="445" y="20" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">/api/preschool Route</text>
      <text x="445" y="36" fill="#64748b" font-size="9" text-anchor="middle">Gemini Flash Bridge</text>

      <rect x="540" width="170" height="46" rx="6" fill="#ffffff" stroke="#a7f3d0" />
      <text x="625" y="20" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">/api/sinhala Route</text>
      <text x="625" y="36" fill="#64748b" font-size="9" text-anchor="middle">FastAPI Model Proxy</text>

      <rect x="720" width="175" height="46" rx="6" fill="#ffffff" stroke="#a7f3d0" />
      <text x="807" y="20" fill="#064e3b" font-size="11" font-weight="700" text-anchor="middle">/api/analytics Route</text>
      <text x="807" y="36" fill="#64748b" font-size="9" text-anchor="middle">Mastery Pipeline Aggregator</text>
    </g>
  </g>

  <!-- Connectors Layer 2 -> Layer 3 -->
